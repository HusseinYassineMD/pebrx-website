<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contact PebRx for partnerships and inquiries.">
  <title>Contact | PebRx</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

</head>
<body class="page-contact" data-page="contact">
  <header class="site-header">
    <nav class="nav container" aria-label="Main navigation">
      <a href="index.html" class="nav-logo" aria-label="PebRx home">
        <span class="nav-logo-mark">
          <img src="/images/logo-icon.png?v=2" alt="" class="nav-logo-icon" aria-hidden="true">
          <img src="/images/logo-text.png?v=3" alt="PebRx" class="nav-logo-text">
        </span>
      </a>
      <button class="nav-toggle" aria-label="Open menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <ul class="nav-links">
        <li><a href="index.html" data-nav="home">Home</a></li>
        <li><a href="science.html" data-nav="science">Science</a></li>
        <li><a href="pipeline.html" data-nav="pipeline">Pipeline</a></li>
        <li><a href="leadership.html" data-nav="leadership">Leadership</a></li>
        <li><a href="publications.html" data-nav="publications">Publications</a></li>
        <li><a href="contact.html" data-nav="contact">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <div class="page-banner page-banner-contact">
      <div class="container">
        <span class="section-label">Contact</span>
        <h1>Contact Us</h1>
      </div>
    </div>
    <section class="section section-contact" id="contact">
          <div class="contact-bg" aria-hidden="true">
            <div class="contact-blob contact-blob-1"></div>
            <div class="contact-blob contact-blob-2"></div>
          </div>
          <div class="container contact-page">
            <div class="contact-header">
              <span class="section-label contact-label">Contact</span>
              <h2 class="contact-title">Contact Us</h2>
              <p class="contact-intro">Partnership inquiries, collaborations, or general questions — we’d love to hear from you.</p>
            </div>
    
            <div class="contact-card">
              <form class="contact-form" id="contact-form" novalidate>
                <div class="form-row form-row-split">
                  <div class="form-field">
                    <label for="first-name">First name</label>
                    <input type="text" id="first-name" name="firstName" autocomplete="given-name" required>
                  </div>
                  <div class="form-field">
                    <label for="last-name">Last name</label>
                    <input type="text" id="last-name" name="lastName" autocomplete="family-name" required>
                  </div>
                </div>
    
                <div class="form-field">
                  <label for="email">Email</label>
                  <input type="email" id="email" name="email" autocomplete="email" required>
                </div>
    
                <div class="form-field">
                  <label for="phone">Phone</label>
                  <div class="phone-input">
                    <span class="phone-prefix" aria-hidden="true">
                      <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
                        <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.5"/>
                        <path d="M3 12h18M12 3c2.5 2.8 4 6 4 9s-1.5 6.2-4 9M12 3c-2.5 2.8-4 6-4 9s1.5 6.2 4 9" stroke="currentColor" stroke-width="1.5"/>
                      </svg>
                      +1
                    </span>
                    <input type="tel" id="phone" name="phone" autocomplete="tel">
                  </div>
                </div>
    
                <div class="form-field">
                  <label for="message">How can we help you?</label>
                  <textarea id="message" name="message" rows="4" required></textarea>
                </div>
    
                <button type="submit" class="contact-submit">Submit</button>
              </form>
            </div>
    
            <div class="contact-footer">
              <a href="index.html" class="contact-footer-logo" aria-label="PebRx home">
                <img src="/images/logo-full.png?v=2" alt="PebRx">
              </a>
            </div>
          </div>
        </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>&copy; 2026 PebRx. All rights reserved.</p>
      <nav aria-label="Footer navigation">
        <a href="science.html">Science</a>
        <a href="pipeline.html">Pipeline</a>
        <a href="leadership.html">Leadership</a>
        <a href="publications.html">Publications</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </footer>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
